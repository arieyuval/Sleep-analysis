<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Science of Sleep</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      text-align: center;
    }

    .video-wrapper {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #111;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
    }

    .btn {
      display: inline-block;
      padding: 0.85rem 2.5rem;
      background: #fff;
      color: #0a0a0f;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-decoration: none;
      border-radius: 100px;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>The Science of Sleep</h1>
    <div class="video-wrapper">
      <video autoplay loop muted playsinline>
        <source src="video.mp4" type="video/mp4" />
      </video>
    </div>
    <a href="content.html" class="btn">Explore the Factors</a>
  </div>
</body>
</html>
